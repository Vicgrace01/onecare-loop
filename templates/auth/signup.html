<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — OneCare Loop</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/onecare.css">
<link rel="stylesheet" href="/static/css/ui.css">
</head>
<body>
<div class="auth-split">

  <aside class="auth-illustration-side">
    <a href="/" class="auth-ilust-brand logo-mark">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#2DD4A8" stroke-width="2.5" stroke-dasharray="22 11" stroke-linecap="round"/>
        <rect x="14.5" y="10" width="3" height="12" rx="1" fill="#E8EEF4"/>
        <rect x="10" y="14.5" width="12" height="3" rx="1" fill="#E8EEF4"/>
      </svg>
      <span class="logo-word">onecare<span class="dot">.</span>loop</span>
    </a>

    <svg class="auth-ilust-ring" viewBox="0 0 400 400" aria-hidden="true">
      <circle cx="200" cy="200" r="140" fill="none" stroke="#2DD4A8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
      <circle cx="200" cy="200" r="100" fill="none" stroke="#FFB088" stroke-width="1" stroke-dasharray="3 6" opacity="0.3"/>
      <circle cx="200" cy="200" r="60" fill="none" stroke="#2DD4A8" stroke-width="1.5" opacity="0.4"/>
      <circle cx="200" cy="200" r="10" fill="#2DD4A8" opacity="0.6"/>
      <circle cx="200" cy="60" r="5" fill="#2DD4A8"/>
      <circle cx="340" cy="200" r="5" fill="#FFB088"/>
      <circle cx="200" cy="340" r="5" fill="#2DD4A8"/>
      <circle cx="60" cy="200" r="5" fill="#FFB088"/>
    </svg>

    <div>
      <p class="auth-ilust-quote">Start proving <em>that care happened</em>. Every transition recorded. Every claim verifiable.</p>
      <p class="auth-ilust-author">— 8-week pilot · 5 pharmacies · 1 hospital · 1 HMO</p>

      <div class="auth-ilust-stats">
        <div class="auth-ilust-stat">
          <div class="v">6</div>
          <div class="l">Canonical states</div>
        </div>
        <div class="auth-ilust-stat">
          <div class="v">8</div>
          <div class="l">Named failures</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <div class="auth-form-head">
        <h1>Create your account</h1>
        <p>Set up your care operations workspace.</p>
      </div>

      <form id="signup-form">
        <label class="field">
          <span class="field-label">Full name</span>
          <input class="input" name="name" placeholder="Dr. Adaeze Okonkwo" required autofocus>
        </label>
        <label class="field">
          <span class="field-label">Email</span>
          <input class="input" type="email" name="email" placeholder="you@hospital.ng" required>
        </label>
        <label class="field">
          <span class="field-label">Role</span>
          <select class="select" name="role">
            <option value="admin">Administrator</option>
            <option value="hospital">Hospital</option>
            <option value="pharmacy">Pharmacy</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input class="input" type="password" name="password" placeholder="6+ characters" required minlength="6">
        </label>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="signup-btn">Create account</button>
        <div id="signup-error" style="display:none; margin-top:12px; padding:10px 14px; background:rgba(248,113,113,0.1); border:1px solid var(--danger); border-radius:var(--r-md); color:var(--danger); font-size:13px;"></div>
      </form>

      <div class="auth-foot">
        Already have an account? <a href="/login">Sign in →</a>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/ui.js"></script>
<script>
const form = document.getElementById('signup-form');
const btn = document.getElementById('signup-btn');
const err = document.getElementById('signup-error');
form.onsubmit = async (e) => {
  e.preventDefault();
  err.style.display = 'none';
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  btn.disabled = true; btn.classList.add('btn-loading'); btn.textContent = 'Creating…';
  try {
    const r = await fetch('/auth/signup', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Signup failed');
    window.location.href = j.redirect;
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
    btn.disabled = false; btn.classList.remove('btn-loading'); btn.textContent = 'Create account';
  }
};
</script>
</body>
</html>
