<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your care receipt — OneCare Loop</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/onecare.css">
<link rel="stylesheet" href="/static/css/ui.css">
<link rel="stylesheet" href="/static/css/motion.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
<style>
  .rwrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  .back-home { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); text-decoration: none; margin-bottom: 16px; }
  .back-home:hover { color: var(--teal); }
  .rhead { display: flex; align-items: center; gap: 14px; padding: 24px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-xl) var(--r-xl) 0 0; border-bottom: none; opacity: 0; }
  .ravatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--peach)); display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 17px; color: var(--bg-base); flex-shrink: 0; box-shadow: 0 0 0 3px var(--bg-surface), 0 0 0 4px rgba(45,212,168,0.3); }
  .rhead-info { flex: 1; min-width: 0; }
  .rhead-info h1 { font-size: 15.5px; margin: 0; font-weight: 600; }
  .rhead-info p { font-size: 12px; margin: 2px 0 0; color: var(--text-secondary); }
  .rhead-badge { font-size: 10px; padding: 5px 11px; border-radius: 999px; background: var(--teal-dim); color: var(--teal); font-weight: 700; letter-spacing: 0.06em; font-family: var(--font-mono); display: inline-flex; align-items: center; gap: 4px; }
  .rhead-badge.broken { background: rgba(248,113,113,0.15); color: var(--danger); }
  .rring { padding: 32px 20px 24px; background: var(--bg-surface); border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); position: relative; overflow: hidden; }
  .rring::before { content: ""; position: absolute; top: 0; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, var(--teal), transparent); opacity: 0.4; }
  .rring-nodes { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; position: relative; }
  .rring-nodes::-webkit-scrollbar { display: none; }
  .rnode { flex: 1 0 68px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .rnode .c { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border-strong); background: transparent; display: grid; place-items: center; color: transparent; font-weight: 700; font-size: 15px; position: relative; }
  .rnode.done .c { background: var(--teal); border-color: var(--teal); color: var(--bg-base); }
  .rnode.done .c::after { content: "✓"; position: absolute; opacity: 0; transition: opacity 200ms ease 400ms; }
  .rnode.done .c.drawn::after { opacity: 1; }
  .rnode.current .c { border-color: var(--warning); box-shadow: 0 0 0 4px rgba(251,191,36,0.15); animation: rpulse 2s infinite; }
  @keyframes rpulse { 0%,100% { box-shadow: 0 0 0 4px rgba(251,191,36,0.15); } 50% { box-shadow: 0 0 0 8px rgba(251,191,36,0.05); } }
  .rnode.broken .c { background: var(--danger); border-color: var(--danger); color: white; }
  .rnode.broken .c::after { content: "✗"; opacity: 1; }
  .rnode .l { font-size: 10.5px; font-weight: 500; color: var(--text-tertiary); }
  .rnode.done .l { color: var(--teal); font-weight: 600; }
  .rnode.current .l { color: var(--text-primary); }
  .rconn { flex: 0 0 12px; height: 2px; background: var(--border-subtle); opacity: 0.4; margin-top: 17px; transform-origin: left; transition: background 400ms ease, opacity 400ms ease; }
  .rconn.done { background: var(--teal); opacity: 1; }
  .rthread { padding: 24px 20px; background: var(--bg-base); border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); border-radius: 0 0 var(--r-xl) var(--r-xl); position: relative; }
  .rmsg { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 14px 14px 14px 2px; padding: 16px 18px; margin-bottom: 14px; max-width: 92%; margin-left: 52px; position: relative; will-change: transform, opacity; }
  .rmsg.failure { border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.05); }
  .rmsg.aux { border-left: 3px solid var(--teal); opacity: 0.9; }
  .rmsg-headline { font-size: 14.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-primary); }
  .rmsg-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .rmsg-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; font-size: 10.5px; color: var(--text-tertiary); font-family: var(--font-mono); }
  .rmsg-verified { color: var(--teal); font-weight: 600; }
  .rmsg-verified.broken { color: var(--danger); }
  .rmsg-hash { color: var(--text-tertiary); cursor: pointer; padding: 1px 4px; border-radius: 3px; transition: background 200ms ease, color 200ms ease; }
  .rmsg-hash:hover { color: var(--teal); background: var(--teal-dim); }
  .ractions { display: grid; gap: 10px; margin-top: 28px; }
  .rbtn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rlang { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; padding: 8px 12px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--r-md); }
  .rlang button { background: none; border: none; color: var(--text-secondary); padding: 4px 12px; border-radius: 999px; cursor: pointer; font-size: 11px; font-weight: 500; transition: all 150ms ease; }
  .rlang button:hover { color: var(--text-primary); background: var(--bg-elevated); }
  .rlang button.active { background: var(--teal-dim); color: var(--teal); font-weight: 700; }
  .rshare { font-size: 12px; color: var(--text-secondary); padding: 14px 18px; background: rgba(45,212,168,0.06); border: 1px solid rgba(45,212,168,0.25); border-radius: var(--r-md); margin-top: 16px; }
  .rshare code { font-family: var(--font-mono); font-size: 11px; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 4px; word-break: break-all; color: var(--teal); }
  .empty-state { padding: 64px 24px; text-align: center; background: var(--bg-surface); border: 1px dashed var(--border-strong); border-radius: var(--r-lg); margin-top: 16px; }
  .empty-state h3 { font-size: 1.15rem; margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; color: var(--text-secondary); max-width: 40ch; margin: 0 auto; line-height: 1.55; }
</style>
</head>
<body>
<div class="rwrap">
  <a href="/patient" class="back-home" id="back-home" style="display:none;">← Back to your home</a>

  <div class="rhead" id="rhead">
    <div class="ravatar" id="avatar">—</div>
    <div class="rhead-info">
      <h1 id="receipt-title">Your care receipt</h1>
      <p id="patient-sub">Loading…</p>
    </div>
    <span class="rhead-badge" id="verified-badge">…</span>
  </div>

  <div class="rring" id="ring-wrap" style="display:none;">
    <div class="rring-nodes" id="ring"></div>
  </div>

  <div id="empty-wrap" style="display:none;">
    <div class="empty-state">
      <h3>Your journey begins at a pharmacy</h3>
      <p>No care events recorded yet. Visit a partner pharmacy to check your blood pressure — the journey starts there.</p>
    </div>
  </div>

  <div id="thread-wrap" style="display:none;">
    <div class="rthread" id="thread"></div>

    <div class="ractions">
      <div class="rbtn-row">
        <button class="btn btn-primary" onclick="verifyChain()" id="verify-btn">Verify chain</button>
        <button class="btn btn-outline" onclick="copyShare()">Copy receipt link</button>
      </div>
      <button class="btn btn-outline btn-full" onclick="confirmAttendance()" id="confirm-btn">I attended my appointment</button>
    </div>

    <div class="rshare" id="share-box" style="display:none;">
      <strong>Shareable receipt:</strong>
      <code id="share-url"></code>
    </div>
  </div>

  <div style="text-align: center; margin-top: 24px;">
    <a href="/patient" style="font-size: 12px; color: var(--text-tertiary);">← Your home</a>
    &nbsp;·&nbsp;
    <a href="/verify" target="_blank" style="font-size: 12px; color: var(--text-tertiary);">Public verifier</a>
  </div>
</div>

<script src="/static/js/ui.js"></script>
<script src="/static/js/motion.js"></script>
<script>
const PATIENT_ID = "{{ patient_id }}";

// The 6 canonical workflow states — these render as the ring.
const CANONICAL_ORDER = [
  "SCREEN_POSITIVE",
  "REFERRAL_CREATED",
  "FACILITY_ACCEPTED",
  "APPOINTMENT_BOOKED",
  "CLINICAL_ENCOUNTER_COMPLETED",
  "CLINICAL_DISPOSITION_RETURNED",
];
const CANONICAL_LABELS = {
  SCREEN_POSITIVE: "Screened",
  REFERRAL_CREATED: "Referred",
  FACILITY_ACCEPTED: "Accepted",
  APPOINTMENT_BOOKED: "Booked",
  CLINICAL_ENCOUNTER_COMPLETED: "Seen",
  CLINICAL_DISPOSITION_RETURNED: "Outcome",
};

// Auxiliary event types — render in the thread, NOT in the ring.
const AUXILIARY = new Set([
  "PATIENT_ACKNOWLEDGED",
  "CONFIRMATORY_TEST",
  "CONSULT_MESSAGE",
  "RED_FLAG_ACKNOWLEDGED",
  "CONSENT_REVOKED",
  "FOLLOWUP_DUE",
  "REPEAT_ASSESSMENT",
  "BP_CONTROL_RECORDED",
]);

const FAILURE_STATES = new Set([
  "REFERRAL_DECLINED","FACILITY_UNAVAILABLE","APPOINTMENT_MISSED",
  "PATIENT_UNREACHABLE","PATIENT_DECLINED","PATIENT_REQUESTED_RESCHEDULE",
  "REFERRAL_REDIRECTED","FOLLOWUP_OVERDUE",
]);

const LANGUAGES = { en: "EN", pcm: "PCM", ig: "IG", ha: "HA", yo: "YO" };

let currentLang = localStorage.getItem("patientLang") || "en";
let receiptData = null;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function timeAgo(iso) {
  const then = new Date(iso).getTime();
  const sec = Math.floor((Date.now() - then) / 1000);
  if (sec < 60) return "just now";
  if (sec < 3600) return Math.floor(sec / 60) + "m ago";
  if (sec < 86400) return Math.floor(sec / 3600) + "h ago";
  if (sec < 604800) return Math.floor(sec / 86400) + "d ago";
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function renderRing(messages, verified) {
  const types = messages.map(m => m.event_type);
  const lastMeaningful = types.filter(t => !AUXILIARY.has(t));
  const lastIsFailure = lastMeaningful.length > 0 && FAILURE_STATES.has(lastMeaningful[lastMeaningful.length - 1]);

  let html = "";
  let currentSeen = false;

  CANONICAL_ORDER.forEach((type, i) => {
    const label = CANONICAL_LABELS[type];
    const done = types.includes(type);
    let cls = "";

    if (done) cls = "done";
    else if (!verified) cls = "broken";
    else if (lastIsFailure) cls = "broken";
    else if (!currentSeen) { cls = "current"; currentSeen = true; }

    if (i > 0) {
      const prevDone = types.includes(CANONICAL_ORDER[i - 1]);
      html += `<div class="rconn ${prevDone ? "done" : ""}"></div>`;
    }
    html += `<div class="rnode ${cls}"><div class="c"></div><div class="l">${label}</div></div>`;
  });
  document.getElementById("ring").innerHTML = html;
}

function renderThread(messages, verified) {
  const thread = document.getElementById("thread");
  thread.innerHTML = "";
  messages.forEach((msg, i) => {
    const isFailure = FAILURE_STATES.has(msg.event_type);
    const isAux = AUXILIARY.has(msg.event_type);
    const div = document.createElement("div");
    div.className = "rmsg" + (isFailure ? " failure" : "") + (isAux ? " aux" : "");
    div.style.animationDelay = (i * 60) + "ms";

    // SAFE text — use textContent, not innerHTML
    const head = document.createElement("div");
    head.className = "rmsg-headline";
    head.textContent = msg.headline || msg.event_type;
    div.appendChild(head);

    if (msg.detail) {
      const det = document.createElement("div");
      det.className = "rmsg-detail";
      det.textContent = msg.detail;
      div.appendChild(det);
    }

    const meta = document.createElement("div");
    meta.className = "rmsg-meta";

    const time = document.createElement("span");
    time.textContent = timeAgo(msg.occurred_at);
    meta.appendChild(time);

    const badge = document.createElement("span");
    badge.className = "rmsg-verified" + (verified ? "" : " broken");
    const short = (msg.hash || "").slice(0, 12);
    badge.textContent = (verified ? "✓ verified" : "✗ broken") + " · " + short;
    badge.style.cursor = "pointer";
    badge.title = "Click to copy hash";
    badge.addEventListener("click", () => {
      if (msg.hash) {
        navigator.clipboard.writeText(msg.hash);
        if (window.UI && UI.Toast) UI.Toast.show("Hash copied", "success");
      }
    });
    meta.appendChild(badge);

    div.appendChild(meta);
    thread.appendChild(div);
  });
}

function animateChainIn() {
  const nodes = document.querySelectorAll('.rnode .c');
  const msgs = document.querySelectorAll('.rmsg');
  const head = document.getElementById('rhead');

  if (reducedMotion || typeof window.gsap === 'undefined') {
    nodes.forEach(n => n.classList.add('drawn'));
    msgs.forEach(m => { m.style.opacity = 1; m.style.transform = 'none'; });
    head.style.opacity = 1;
    return;
  }

  gsap.to(head, { opacity: 1, duration: 0.5, ease: 'power2.out' });
  nodes.forEach((n, i) => {
    setTimeout(() => n.classList.add('drawn'), 200 + i * 120);
  });
  msgs.forEach((m, i) => {
    gsap.to(m, {
      opacity: 1, y: 0, scale: 1, duration: 0.5, delay: 0.3 + i * 0.08, ease: 'power2.out',
    });
  });
}

async function load() {
  let data;
  try {
    const r = await fetch(`/api/patient/${PATIENT_ID}/receipt`);
    if (!r.ok) throw new Error("receipt not found");
    data = await r.json();
    receiptData = data;
  } catch (e) {
    document.getElementById("patient-sub").textContent = e.message;
    return;
  }

  document.getElementById("avatar").textContent = PATIENT_ID.slice(0, 2).toUpperCase();

  fetch("/patient/me").then(x => x.json()).then(j => {
    if (j.ok && j.patient_id === PATIENT_ID) {
      document.getElementById("back-home").style.display = "inline-flex";
    }
  }).catch(() => {});

  const n = data.messages.length;
  document.getElementById("patient-sub").textContent =
    n + " event" + (n === 1 ? "" : "s") + " · " + (data.verified ? "chain verified" : "chain broken");

  const badge = document.getElementById("verified-badge");
  badge.innerHTML = data.verified
    ? '<svg width="10" height="10" viewBox="0 0 12 12" style="vertical-align:middle;margin-right:4px"><path d="M2 6 L5 9 L10 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> VERIFIED'
    : '✗ BROKEN';
  badge.className = "rhead-badge" + (data.verified ? "" : " broken");

  if (n === 0) {
    document.getElementById("empty-wrap").style.display = "block";
    return;
  }

  document.getElementById("ring-wrap").style.display = "block";
  document.getElementById("thread-wrap").style.display = "block";

  renderRing(data.messages, data.verified);
  renderThread(data.messages, data.verified);
  document.getElementById("share-url").textContent = location.origin + "/patient/receipt/" + PATIENT_ID;

  setTimeout(animateChainIn, 100);
}

async function verifyChain() {
  const btn = document.getElementById("verify-btn");
  btn.disabled = true;
  btn.textContent = "Verifying…";
  try {
    const r = await fetch(`/api/audit/verify/${PATIENT_ID}`);
    const j = await r.json();
    await new Promise(res => setTimeout(res, 400));
    if (j.ok) {
      btn.textContent = `✓ Verified · ${j.events} events`;
      btn.style.background = "var(--teal)";
      if (window.UI && UI.Toast) UI.Toast.show(`Chain verified · ${j.signed}/${j.events} signed`, "success");
    } else {
      btn.textContent = `✗ Broken at seq ${j.broken_at?.seq}`;
      btn.style.background = "var(--danger)";
    }
    setTimeout(() => {
      btn.textContent = "Verify chain"; btn.style.background = ""; btn.disabled = false;
    }, 3000);
  } catch (e) {
    if (window.UI && UI.Toast) UI.Toast.show(e.message, "error");
    btn.disabled = false; btn.textContent = "Verify chain";
  }
}

async function confirmAttendance() {
  const btn = document.getElementById("confirm-btn");
  btn.disabled = true; btn.textContent = "Recording…";
  try {
    const r = await fetch(`/api/patient/${PATIENT_ID}/confirm-attendance`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: "I attended" }),
    });
    const j = await r.json();
    if (j.ok) {
      if (window.UI && UI.Toast) UI.Toast.show("Recorded", "success");
      btn.textContent = "✓ Recorded";
    } else throw new Error(j.message);
  } catch (e) {
    if (window.UI && UI.Toast) UI.Toast.show(e.message, "error");
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = "I attended my appointment"; }, 2000);
  }
}

function copyShare() {
  navigator.clipboard.writeText(location.origin + "/patient/receipt/" + PATIENT_ID);
  if (window.UI && UI.Toast) UI.Toast.show("Link copied", "success");
  document.getElementById("share-box").style.display = "block";
}

function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem("patientLang", lang);
  document.querySelectorAll('[data-lang]').forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
}

window.addEventListener("DOMContentLoaded", () => {
  const langBar = document.createElement("div");
  langBar.className = "rlang";
  langBar.innerHTML = Object.entries(LANGUAGES).map(([code, label]) =>
    `<button data-lang="${code}" class="${code === currentLang ? "active" : ""}" onclick="switchLang('${code}')">${label}</button>`
  ).join("");
  document.querySelector(".rwrap").insertBefore(langBar, document.querySelector(".rhead"));
  load();
});
</script>
</body>
</html>
